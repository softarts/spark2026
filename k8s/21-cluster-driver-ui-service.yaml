# Stable in-cluster name for the Spark UI of a *running* Cluster-Mode Driver Pod.
# Spark labels every Driver Pod it creates with spark-role=driver; the Notebook
# Pod (Client-Mode Driver) does not carry this label. Completed Driver Pods are
# not Ready, so only the running Driver receives traffic. If several Cluster-Mode
# jobs run at once, requests are spread across them; use the History Server
# (Phase 2) for per-application UIs.
apiVersion: v1
kind: Service
metadata:
  name: spark-cluster-driver-ui
  namespace: spark-lab
  labels:
    app.kubernetes.io/part-of: spark-platform-learning-lab
spec:
  selector:
    spark-role: driver
  ports:
    - name: spark-ui
      port: 4040
      targetPort: 4040
      protocol: TCP
