# This selector intentionally supports exactly one active personal Client-Mode
# Driver. JupyterHub applies the matching label via singleuser.extraLabels.
apiVersion: v1
kind: Service
metadata:
  name: spark-client-driver
  namespace: spark-lab
  labels:
    app.kubernetes.io/part-of: spark-platform-learning-lab
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    spark-lab/driver: interactive-client
  ports:
    - name: driver-rpc
      port: 7078
      targetPort: 7078
      protocol: TCP
    - name: blockmanager
      port: 7079
      targetPort: 7079
      protocol: TCP
    - name: spark-ui
      port: 4040
      targetPort: 4040
      protocol: TCP
