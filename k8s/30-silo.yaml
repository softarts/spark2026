# Docker Desktop Kubernetes baseline. The image is a reviewed, immutable
# multi-architecture digest. Create silo-root-credentials locally; never commit
# real credentials.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: silo-data
  namespace: spark-lab
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: silo
  namespace: spark-lab
  labels:
    app.kubernetes.io/name: silo
    app.kubernetes.io/part-of: spark-platform-learning-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: silo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: silo
        app.kubernetes.io/part-of: spark-platform-learning-lab
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: silo
          image: pgsty/silo@sha256:c20d112390b9a9ce8c11b8af95ad35bcaa62f4759663c09c936cd8d2b511f329
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: silo-root-credentials
                  key: accessKey
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: silo-root-credentials
                  key: secretKey
            # The Web Console is served behind Traefik at /silo/. The Console
            # derives its sub-path from this URL; the host part is not checked,
            # so the Console also works via http://<mac-lan-ip>:8080/silo/.
            - name: MINIO_BROWSER_REDIRECT_URL
              value: http://localhost:8080/silo
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: s3
          livenessProbe:
            tcpSocket:
              port: s3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: silo-data
---
apiVersion: v1
kind: Service
metadata:
  name: silo
  namespace: spark-lab
  labels:
    app.kubernetes.io/name: silo
    app.kubernetes.io/part-of: spark-platform-learning-lab
spec:
  selector:
    app.kubernetes.io/name: silo
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
