# Defaults for every Spark application started from the runtime image
# (Notebook kernels, spark-submit, Cluster-Mode Drivers).

# The Spark UI is served behind Traefik at /spark-ui/ and /spark-driver/.
# Traefik strips the prefix and sends X-Forwarded-Context. Page links honour
# that header by default, but Spark's own 302 redirects (/ -> /jobs/,
# /environment -> /environment/) only do so when proxyRedirectUri is set.
# "/" keeps the browser's host and port and adds the X-Forwarded-Context
# prefix; requests without the header (in-Pod curl) are unaffected.
spark.ui.proxyRedirectUri  /
