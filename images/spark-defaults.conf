# Defaults for every Spark application started from the runtime image
# (Notebook kernels, spark-submit, Cluster-Mode Drivers, the History Server).
# For Cluster Mode, spark-submit copies these settings into the Driver Pod's
# ConfigMap, so they apply there too.

# --- Spark UI behind the portal ------------------------------------------
# The Spark UI is served at /spark-ui/<user>/, /spark-driver/<user>/ and the
# History Server at /history/. The proxy strips the prefix and sends
# X-Forwarded-Context. Page links honour that header by default, but Spark's
# own 302 redirects (/ -> /jobs/, /environment -> /environment/) only do so
# when proxyRedirectUri is set. "/" keeps the browser's host and port and adds
# the X-Forwarded-Context prefix; requests without the header are unaffected.
spark.ui.proxyRedirectUri  /

# --- Silo (S3A) defaults ---------------------------------------------------
# Credentials come from the environment (AWS_ACCESS_KEY_ID /
# AWS_SECRET_ACCESS_KEY), filled from the Secret silo-shared-credentials: the
# shared NON-root Silo user lab-user. Examples that set fs.s3a.access.key
# explicitly still work; this default is what event logging relies on.
spark.hadoop.fs.s3a.endpoint                   http://silo.spark-lab.svc:9000
spark.hadoop.fs.s3a.path.style.access          true
spark.hadoop.fs.s3a.connection.ssl.enabled     false
spark.hadoop.fs.s3a.aws.credentials.provider   software.amazon.awssdk.auth.credentials.EnvironmentVariableCredentialsProvider
# Spark Pods created on Kubernetes get the same two variables from the Secret
# in their own namespace (the Notebook Pod gets them from jupyterhub/values.yaml).
spark.kubernetes.driver.secretKeyRef.AWS_ACCESS_KEY_ID        silo-shared-credentials:accessKey
spark.kubernetes.driver.secretKeyRef.AWS_SECRET_ACCESS_KEY    silo-shared-credentials:secretKey
spark.kubernetes.executor.secretKeyRef.AWS_ACCESS_KEY_ID      silo-shared-credentials:accessKey
spark.kubernetes.executor.secretKeyRef.AWS_SECRET_ACCESS_KEY  silo-shared-credentials:secretKey

# --- Event log for the History Server (/history/) ---------------------------
# The Driver writes every application's events to Silo; the History Server
# rebuilds the Spark UI from them after the application has finished.
# startcluster.sh creates the prefix (an empty S3 prefix is not a directory,
# and Spark refuses to start if the log directory does not exist).
# Applications are attributed by sparkUser (= SPARK_USER, the JupyterHub
# user name). That value is set by the platform but a user can override it.
spark.eventLog.enabled   true
spark.eventLog.dir       s3a://spark-data/spark-logs/
